[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentenv-portsim"
version = "0.4.0"
description = "PortSimEnv as an AgentEnv environment: an agent re-plans a disrupted week of container-ship berthing at a Port of Barcelona quay through MCP tools."
readme = "README.md"
license = "Apache-2.0 AND CC-BY-SA-4.0 AND CC-BY-4.0 AND LicenseRef-Meteocat"
license-files = ["LICENSE", "NOTICE", "data/LICENSE"]
requires-python = ">=3.11"
keywords = ["agentenv", "mcp", "reinforcement-learning", "llm-agents", "portsim", "berth-planning", "scheduling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The env image pins its own server dependencies (Dockerfile); CI runs the golden and replay tests against it.
dependencies = [
    "agentenv-framework>=0.9.1298",
    "agentenv-framework-protocol>=0.1.290,<0.2",
    "agentenv-hf @ https://github.com/earakely-scale/agentenv-hf-plugin/archive/refs/tags/v0.3.0.tar.gz",
    "berth-core @ https://github.com/adithya-s-k/FineEnvs/archive/b0f4c2f9526e3c45d608b4f92f6ec6c71fecc152.tar.gz#subdirectory=07-simulation-environments/portsim-v1/envs/berth_planning/core",
    "fastmcp==3.4.8",
    "pydantic>=2.13,<2.14",
    "websockets>=15,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17", "hatchling>=1.27", "anthropic==1.11.0", "openai==2.54.0"]

[project.urls]
Source = "https://github.com/earakely-scale/agentenv-portsim-plugin"
PortSimEnv = "https://github.com/adithya-s-k/FineEnvs/tree/main/07-simulation-environments/portsim-v1"

[project.entry-points."agent_env.bundles"]
portsim = "agentenv_portsim.bundles"
portsim-live = "agentenv_portsim.bundles"
portsim-marine = "agentenv_portsim.bundles"
portsim-wind = "agentenv_portsim.bundles"

[project.entry-points."agent_env.cli_plugins"]
portsim = "agentenv_portsim.cli:portsim"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentenv_portsim"]
# src/agentenv_portsim/data links to data/ for editable installs; an sdist drops the link, so wheels force-include data/.
exclude = ["src/agentenv_portsim/data"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "agentenv_portsim/data"

[tool.hatch.build.targets.sdist]
include = ["/src", "/data", "/tests", "/agents", "/Dockerfile", "/README.md", "/LICENSE", "/NOTICE", "/VENDORED.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: downloads from the public bucket",
    "browser: drives headless Chrome and ffmpeg (and loads three.js from its CDN)",
]
addopts = "-m 'not network and not browser'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
