name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's newer push supersedes its running checks; main keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash  # -eo pipefail

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install 'ruff>=0.16,<0.17'
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: agent-env plugin check

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      registry:
        image: mirror.gcr.io/library/registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install .
      # The README's quickstart: build and register the image, then the wiring tasks, which call no model.
      - run: agent-env portsim setup
      - name: The optimal plan scores 1, an infeasible plan at most 0.2, and no submission 0
        run: |
          agent-env run portsim --task smoke --task wiring-infeasible --task wiring-nosubmit | tee wiring.log
          grep -qE 'tasks/smoke\.json v[0-9]+: passed \([^:]+: 1\)' wiring.log
          grep -qE 'tasks/wiring-infeasible\.json v[0-9]+: scored below 1 \([^:]+: 0(\.[01][0-9]*|\.2)?\)' wiring.log
          grep -qE 'tasks/wiring-nosubmit\.json v[0-9]+: scored below 1 \([^:]+: 0\)' wiring.log
